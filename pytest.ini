[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: integration tests that may take longer
    stress: stress tests for performance benchmarking
    live: tests requiring live API connections
    unit: fast unit tests
    sequential: tests that must run sequentially (no parallelism)
    requires_host_env: asserts facts about the host machine (installed binaries,
        soundfonts, secrets files) rather than Jarvis behaviour. Excluded in CI
        with -m "not requires_host_env"; run locally to check your own setup.

# Timeout settings (requires pytest-timeout)
# 120s per test: the first sentence_transformers import takes ~27s on Windows
# (it walks the transformers tokenizer-registry at import time), and the
# embedding model load adds more. The previous 30s timeout predated torch being
# installed and timed out the first model-touching test on every run. Slow
# embedding stress tests are still bounded by faulthandler_timeout below.
timeout = 120
timeout_method = thread

# Default options: parallel execution with limits
# -n auto can cause issues with embedding interconnect
# Tests marked @pytest.mark.sequential should use -n0
addopts = -n4 --maxfail=5 --durations=10 --ignore=tests/test_full_stack_integration.py --ignore=tests/test_live_integration.py --ignore=tests/test_api_manager_stress.py

# Diagnostic stack dump threshold. Must stay above the per-test `timeout` above,
# otherwise every slow-but-passing test spews a full traceback. The embedding
# stress tests encode hundreds of texts through a 239M-parameter model, one call
# at a time, serialized behind ConceptEmbedder's lock — minutes, not seconds,
# once torch is installed. Deselect them with -m "not slow" for a quick run.
faulthandler_timeout = 400