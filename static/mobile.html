    <title>Jarvis</title>
    
    <style>
      /* Critical CSS for fast initial paint */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { height: 100%; width: 100%; overflow: hidden; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0a0a0a;
        color: #ffffff;
      }
      .loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 16px;
      }
      .loading-screen svg {
        width: 80px;
        height: 80px;
        color: #58a6ff;
        animation: pulse 2s ease-in-out infinite;
      }
      .loading-screen p {
        color: #888;
        font-size: 14px;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
    </style>
    <script type="module" crossorigin src="/assets/mobile-DEX1J3Hd.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/index-D8e80eJI.js">
    <link rel="stylesheet" crossorigin href="/assets/mobile-BhGn8jI_.css">
  </head>
  <body>
    <div id="root">
      <div class="loading-screen">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width="2" />
          <circle cx="35" cy="40" r="5" fill="currentColor" />
          <circle cx="65" cy="40" r="5" fill="currentColor" />
          <path d="M35 65 Q50 75 65 65" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" />
        </svg>
        <p>Loading Jarvis...</p>
      </div>
    </div>
    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw-mobile.js')
            .then(reg => console.log('SW registered:', reg.scope))
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
